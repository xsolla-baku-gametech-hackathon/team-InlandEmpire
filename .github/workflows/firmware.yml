name: Firmware
on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile pad sketch for ESP32
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 2.0.17
          libraries: |
            - name: MFRC522
          sketch-paths: |
            - firmware/tappad_pad
          cli-compile-flags: |
            - --export-binaries
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tappad_pad-esp32
          path: firmware/tappad_pad/build/esp32.esp32.esp32/
          if-no-files-found: error
