name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System deps (serial for the bridge, webview for the game)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libssl-dev libwebkit2gtk-4.1-dev \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Game page tests
        run: node --test "crates/tappad-game/ui-tests/*.test.mjs"
      - name: JavaScript SDK tests
        run: node --test "sdk/tappad-js/test/*.test.mjs"
      - name: No secrets committed
        run: |
          ! git grep -nE 'XSOLLA_API_KEY=[A-Za-z0-9]{8,}' -- ':!.env.example'

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
